services:
  shelfarr:
    image: ${SHELFARR_IMAGE:-ghcr.io/pedro-revez-silva/shelfarr:2026.11.09.1}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5056:80"
    environment:
      SOLID_QUEUE_IN_PUMA: "1"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WEB_CONCURRENCY: "0"
      RAILS_MAX_THREADS: "5"
      RAILS_LOG_LEVEL: warn
      BOOKORBIT_DELIVERY_ROOT: /ebooks
    volumes:
      - ./data:/rails/storage
      - ./staging:/ebooks
      - ./downloads:/downloads
      - ./bookorbit_mcp.rb:/rails/config/initializers/bookorbit_mcp.rb:ro
    mem_limit: 1536m
    cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
  gutenberg:
    image: python:3.12-slim
    restart: unless-stopped
    command: ["python", "/provider.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./gutenberg.py:/provider.py:ro
    read_only: true
    user: "65534:65534"
    mem_limit: 96m
    cpus: "0.2"
